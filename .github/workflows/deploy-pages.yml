name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build landing (terminal-portfolio)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install landing dependencies
        run: cd landing && npm install

      - name: Build landing
        run: cd landing && npm run build

      - name: Prepare output directory
        run: |
          mkdir -p _site
          cp -r landing/dist/* _site/

      # Build MkDocs docs
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs dependencies
        run: pip install -r requirements.txt

      - name: Build MkDocs
        run: mkdocs build --strict

      - name: Copy docs to output
        run: |
          mkdir -p _site/docs
          cp -r site-docs/* _site/docs/

      # Upload combined site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

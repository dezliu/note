site_name: 个人笔记
site_description: 个人笔记与知识记录
site_author: dezliu
site_url: https://dezliu.github.io/note/docs/
site_dir: site-docs
repo_url: https://github.com/dezliu/note
repo_name: dezliu/note

theme:
  name: terminal
  palette: default
  custom_dir: overrides

extra_css:
  - css/custom.css

plugins:
  - search

hooks:
  - hooks/folder_toc.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true

# 侧栏导航由 MkDocs 按 docs/ 目录结构自动生成；首页「目录」由 hooks/folder_toc.py 按文件夹自动生成

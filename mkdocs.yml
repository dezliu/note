site_name: 个人笔记
site_description: 个人笔记与知识记录
site_author: dezliu
site_url: https://dezliu.github.io/note/
repo_url: https://github.com/dezliu/note
repo_name: dezliu/note

theme:
  name: terminal
  palette: default

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true

nav:
  - 首页: index.md
  - Hello World: hello-world.md

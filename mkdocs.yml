site_name: 个人笔记
site_description: 个人笔记与知识记录
site_author: dezliu
site_url: https://dezliu.github.io/note/
repo_url: https://github.com/dezliu/note
repo_name: dezliu/note

theme:
  name: terminal
  palette: default
  custom_dir: overrides

extra_css:
  - css/custom.css

plugins:
  - search

hooks:
  - hooks/folder_toc.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true

# 侧栏导航按文件夹分组；首页「目录」由 hooks/folder_toc.py 按文件夹自动生成
nav:
  - 首页: index.md
  - Java:
      - 概览: java/index.md
      - 进阶: java/advanced/index.md
      - JVM 概览: java/advanced/jvm/index.md
      - 内存与垃圾回收:
          - 概览: java/advanced/jvm/memory/index.md
          - JVM和Java体系结构: java/advanced/jvm/memory/01-JVM和Java体系结构.md
          - 类加载子系统: java/advanced/jvm/memory/02-类加载子系统.md
          - 运行时数据区概述及线程: java/advanced/jvm/memory/03-运行时数据区概述及线程.md
          - 程序计数器: java/advanced/jvm/memory/04-程序计数器.md
          - 虚拟机栈: java/advanced/jvm/memory/05-虚拟机栈.md
          - 本地方法接口: java/advanced/jvm/memory/06-本地方法接口.md
          - 本地方法栈: java/advanced/jvm/memory/07-本地方法栈.md
          - 堆: java/advanced/jvm/memory/08-堆.md
          - 方法区: java/advanced/jvm/memory/09-方法区.md
          - 对象的实例化内存布局与访问定位: java/advanced/jvm/memory/10-对象的实例化内存布局与访问定位.md
          - 直接内存: java/advanced/jvm/memory/11-直接内存.md
          - 执行引擎: java/advanced/jvm/memory/12-执行引擎.md
          - StringTable: java/advanced/jvm/memory/13-StringTable.md
          - 垃圾回收概述: java/advanced/jvm/memory/14-垃圾回收概述.md
          - 垃圾回收相关算法: java/advanced/jvm/memory/15-垃圾回收相关算法.md
          - 垃圾回收相关概念: java/advanced/jvm/memory/16-垃圾回收相关概念.md
          - 垃圾回收器: java/advanced/jvm/memory/17-垃圾回收器.md
      - 字节码与类的加载器:
          - 概览: java/advanced/jvm/classloader/index.md
          - Class文件结构: java/advanced/jvm/classloader/01-Class文件结构.md
          - 字节码指令集与解析举例: java/advanced/jvm/classloader/02-字节码指令集与解析举例.md
          - 类的加载过程详解: java/advanced/jvm/classloader/03-类的加载过程详解.md
          - 再谈类的加载器: java/advanced/jvm/classloader/04-再谈类的加载器.md
      - 性能监控与调优:
          - 概览: java/advanced/jvm/tuning/index.md
          - 概述篇: java/advanced/jvm/tuning/01-概述篇.md
          - JVM监控及诊断工具-命令行篇: java/advanced/jvm/tuning/02-JVM监控及诊断工具-命令行篇.md
          - JVM监控及诊断工具-GUI篇: java/advanced/jvm/tuning/03-JVM监控及诊断工具-GUI篇.md
          - JVM运行时参数: java/advanced/jvm/tuning/04-JVM运行时参数.md
          - 分析GC日志: java/advanced/jvm/tuning/05-分析GC日志.md
          - OOM常见场景及解决方案: java/advanced/jvm/tuning/06-OOM常见场景及解决方案.md
          - 性能优化案例: java/advanced/jvm/tuning/07-性能优化案例.md
          - Java代码层及其它层面优化: java/advanced/jvm/tuning/08-Java代码层及其它层面优化.md
  - AI:
      - 概览: ai/index.md
      - Prompt 工程: ai/prompt.md
